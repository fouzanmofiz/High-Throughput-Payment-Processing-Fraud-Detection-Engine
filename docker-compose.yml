services:

  mysql:
    image: mysql:8.0
    container_name: payment-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_engine
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_password
    volumes:
      - mysql_data:/var/lib/mysql

  kafka:
    image: apache/kafka:4.0.1
    container_name: payment-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  redis:
    image: redis:7
    container_name: payment-redis
    ports:
      - "6379:6379"

  payment-engine:
    image: payment-engine:latest
    container_name: payment-engine
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - kafka
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_engine
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_password

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

volumes:
  mysql_data: